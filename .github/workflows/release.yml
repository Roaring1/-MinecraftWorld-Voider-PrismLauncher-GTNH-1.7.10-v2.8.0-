name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python builds do not include the system _tkinter extension. Use
      # Ubuntu's matched Python/Tk packages for the native GUI build.
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - run: chmod +x build_linux.sh install_native_linux.sh && PYTHON=/usr/bin/python3 ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Voider-GTNH
            dist/Voider-GTNH-linux-x86_64-onedir.tar.gz
            dist/GTNH-World-Voider-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - shell: pwsh
        run: ./build_voider.ps1
      - shell: pwsh
        run: |
          if (-not (Test-Path dist/Voider-GTNH.exe)) { throw 'ONEFILE executable missing' }
          if (-not (Test-Path dist/Voider-GTNH/Voider-GTNH.exe)) { throw 'ONEDIR executable missing' }
          $hash = (Get-FileHash dist/Voider-GTNH.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Voider-GTNH.exe" | Set-Content dist/SHA256SUMS-windows.txt
          Compress-Archive -Path dist/Voider-GTNH/* -DestinationPath dist/Voider-GTNH-windows-onedir.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Voider-GTNH.exe
            dist/Voider-GTNH-windows-onedir.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt
      - run: chmod +x prepare_release.sh && PYTHON=python ./prepare_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: release-out/v*/*
          if-no-files-found: error

  publish:
    needs: [linux, windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "GTNH World Voider ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md \
            --latest
