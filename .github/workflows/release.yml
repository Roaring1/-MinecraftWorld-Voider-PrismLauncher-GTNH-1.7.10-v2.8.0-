name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: chmod +x build_linux.sh && ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Voider-GTNH
            dist/Voider-GTNH-linux-x86_64-onedir.tar.gz
            dist/SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - shell: pwsh
        run: ./build_voider.ps1
      - shell: pwsh
        run: |
          $hash = (Get-FileHash dist/Voider-GTNH.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Voider-GTNH.exe" | Set-Content dist/SHA256SUMS-windows.txt
          Compress-Archive -Path dist/Voider-GTNH/* -DestinationPath dist/Voider-GTNH-windows-onedir.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Voider-GTNH.exe
            dist/Voider-GTNH-windows-onedir.zip
            dist/SHA256SUMS-windows.txt

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt
      - run: chmod +x prepare_release.sh && ./prepare_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: release-out/v*/*

  publish:
    needs: [linux, windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "GTNH World Voider ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md \
            --latest
