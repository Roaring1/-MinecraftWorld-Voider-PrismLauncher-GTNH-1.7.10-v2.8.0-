name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-python builds do not include the system _tkinter extension. Use
      # Ubuntu's matched Python/Tk packages for the native GUI build.
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - run: chmod +x build_linux.sh install_native_linux.sh && PYTHON=/usr/bin/python3 ./build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Voider-GTNH
            dist/Voider-GTNH-linux-x86_64-onedir.tar.gz
            dist/GTNH-World-Voider-linux-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - shell: pwsh
        run: ./build_voider.ps1
      - shell: pwsh
        run: |
          if (-not (Test-Path dist/Voider-GTNH.exe)) { throw 'ONEFILE executable missing' }
          if (-not (Test-Path dist/Voider-GTNH/Voider-GTNH.exe)) { throw 'ONEDIR executable missing' }
          $hash = (Get-FileHash dist/Voider-GTNH.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Voider-GTNH.exe" | Set-Content dist/SHA256SUMS-windows.txt
          Compress-Archive -Path dist/Voider-GTNH/* -DestinationPath dist/Voider-GTNH-windows-onedir.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Voider-GTNH.exe
            dist/Voider-GTNH-windows-onedir.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-runtime.txt
      - run: chmod +x prepare_release.sh && PYTHON=python ./prepare_release.sh
      - name: Flatten versioned release output for upload
        # actions/upload-artifact preserves path segments up to the first
        # wildcard. release-out/v*/* keeps a v<version>/ folder inside the
        # artifact, which later becomes a real directory in release-assets/
        # and breaks `gh release create`'s asset glob ("is a directory").
        # Flattening first guarantees only files, never directories, are
        # uploaded.
        run: |
          set -euo pipefail
          mkdir -p release-out/flat
          version="$(tr -d '[:space:]' < VERSION)"
          version_dir="release-out/v${version}"
          if [ ! -d "$version_dir" ]; then
            echo "Expected $version_dir from prepare_release.sh, but it does not exist." >&2
            exit 1
          fi
          cp "$version_dir"/*-source.tar.gz release-out/flat/
          cp "$version_dir"/*-source.zip release-out/flat/
          cp "$version_dir/SHA256SUMS.txt" release-out/flat/SHA256SUMS-source.txt
          ls -la release-out/flat
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: release-out/flat/*
          if-no-files-found: error

  publish:
    needs: [linux, windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: |
          if find release-assets -maxdepth 1 -type d ! -path release-assets | grep -q .; then
            echo "ERROR: unexpected directory under release-assets/:" >&2
            find release-assets -maxdepth 1 -type d ! -path release-assets >&2
            exit 1
          fi
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "GTNH World Voider ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md \
            --latest
